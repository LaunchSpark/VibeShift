[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeshift"
version = "0.1.0"
description = "Sentiment Analytics for Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # marimo-studio pins an exact marimo version, so bump the two together.
  "marimo==0.25.1",
  "marimo-studio[recommended]>=0.3.0,<0.4",
  # marimo-studio 0.3.0 declares click>=8.2 but its CLI crashes on click 8.3.x.
  "click>=8.5",
  "anywidget>=0.11",
  "wigglystuff>=0.5",
  "discord.py>=2.7,<3",
  "python-dotenv>=1.0",
  "laya @ git+https://github.com/NandhaKishorM/laya.git",
  "huggingface_hub",
  "tqdm",
  "httpx>=0.28",
]

[project.scripts]
vibeshift-bot = "vibeshift.bot:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vibeshift", "evaluation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["model: loads the real emotion model (slow)"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# macos = "12.0" lowers the assumed macOS floor so the env resolves on macOS 12.
platforms = [
  { name = "mac-intel", platform = "osx-64", macos = "12.0" },
  { name = "mac-arm", platform = "osx-arm64", macos = "12.0" },
  "linux-64",
]

# Heavy native packages come from conda-forge (torch 2.14 ships for osx-64).
[tool.pixi.dependencies]
python = "3.12.*"
pytorch = ">=2.9"
transformers = "*"
numpy = "*"
nodejs = "24.*"
# Evaluation project (evaluation/): metrics, stacking head, and Altair charts.
# vl-convert-python exports Altair charts to PNG/SVG headlessly for eval-report.
# (marimo itself is pinned under [project.dependencies].)
scikit-learn = "*"
altair = "*"
vl-convert-python = "*"
polars = "*"

# Everything else from [project.dependencies] is resolved from PyPI by pixi.
[tool.pixi.pypi-dependencies]
vibeshift = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-asyncio = "*"

[tool.pixi.environments]
default = { features = ["test"] }

[tool.pixi.tasks]
test = "pytest -m 'not model'"
test-model = "pytest -m model"
bot = "vibeshift-bot"
dev = { cmd = "python scripts/dev.py", depends-on = ["dash-install"] }
notebook = "marimo edit notebooks/emotion_tracker.py"
dash-install = "npm --prefix dashboard install"
dash = "npm --prefix dashboard run dev"
dash-test = "npm --prefix dashboard test -- --run"
pb-install = "python scripts/install_pocketbase.py 0.40.5"
pb-superuser = { cmd = "python scripts/pb_superuser.py", depends-on = ["pb-install"] }
pb = { cmd = "operations/tools/pocketbase/pocketbase serve --http=127.0.0.1:8090 --dir=operations/data/pocketbase --migrationsDir=pb_migrations --origins=http://localhost:5173,http://127.0.0.1:5173", depends-on = ["pb-superuser"] }

# Evaluation project (evaluation/). Each model task writes predictions/{model}.jsonl;
# eval-report scores every prediction file. All run on the sample fixture until the
# real dataset lands. See evaluation/README.md for the handoff map.
eval-export = "python -m evaluation.curation.export_from_pb"          # A & B
eval-kappa = "python -m evaluation.annotation.reliability"            # A & B
eval-tau = "python -m evaluation.annotation.tau_sweep"                # A & B / Lucas
eval-laya = "python -m evaluation.models.laya.run"                    # Lucas
eval-transformers = "python -m evaluation.models.transformers.run"    # C
eval-llm = "python -m evaluation.models.llm.run"                      # C
eval-nrc = "python -m evaluation.models.nrc_lexicon.run"              # D
eval-stack = "python -m evaluation.models.stacking.train"             # D
eval-report = "python -m evaluation.eval.evaluate"                    # D
eval-notebook = "marimo edit evaluation/eval/explore_eval.py"         # everyone
